## main/idf_component.yml —— 主组件的托管依赖。
##
## - esp_audio_codec：esp_opus_enc（定点 Opus；C3 已被官方录音笔固件与 xiaozhi 验证）
## - linenoise / argtable3：esp_console REPL 所需；IDF 5.5 起移出核心组件，
##   由应用侧以托管组件提供（对齐 IDF 官方 console 示例的做法）。
## fatfs / wear_levelling / console 是 IDF 内置组件，在 CMakeLists REQUIRES 声明。
dependencies:
  espressif/esp_audio_codec: "^2.5.0"
  espressif/linenoise: "^1.0.0"
  espressif/argtable3: "^3.2.2"
  idf: ">=5.5.3,<5.6.0"
